[workspace]
resolver = "3"
members = ["crates/*", "fuzz"]
exclude = ["vendor/pyo3-0.25.1", "vendor/pyo3-macros-backend-0.25.1"]

[patch.crates-io]
pyo3 = { path = "vendor/pyo3-0.25.1" }
pyo3-macros-backend = { path = "vendor/pyo3-macros-backend-0.25.1" }

[workspace.dependencies]
simdutf8 = { git = "https://github.com/rusticstuff/simdutf8", rev = "1890235e87c59a44d45efa6a44fcf9b7166183d4" }

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
