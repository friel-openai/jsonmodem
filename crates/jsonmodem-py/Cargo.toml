[package]
name = "jsonmodem-py"
# Pre-release so the Python distribution maps to 0.0.0a0 via maturin's SemVer→PEP440 mapping
version = "0.0.0-alpha.0"
edition = "2021"
readme = "README.md"
license = "MIT OR Apache-2.0"
description = "Python bindings for the jsonmodem Rust crate"

[lib]
name = "_jsonmodem"
crate-type = ["cdylib"]

[dependencies]
jsonmodem = { path = "../jsonmodem" }
pyo3 = { version = "0.25", features = ["extension-module"] }
itoa = "1"
smallvec = "1.15"
zmij = "=1.0.21"
half = "2.6"
chrono = { version = "0.4", default-features = false, features = ["std"] }
lexical-parse-float = { version = "1.0.5", default-features = false }
simdutf8 = { workspace = true }
