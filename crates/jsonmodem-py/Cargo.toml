[package]
name = "jsonmodem-py"
# Pre-release so the Python distribution maps to 0.0.0a0 via maturin's SemVer→PEP440 mapping
version = "0.0.0-alpha.0"
edition = "2021"
readme = "README.md"
license = "MIT OR Apache-2.0"
description = "Python bindings for the jsonmodem Rust crate"

[lib]
name = "_jsonmodem"
crate-type = ["cdylib"]

[features]
default = ["python-acceleration", "simd", "cached-zipper"]
python-acceleration = []
simd = ["jsonmodem/simd"]
cached-zipper = ["jsonmodem/cached-zipper"]

[dependencies]
jsonmodem = { path = "../jsonmodem", default-features = false }
pyo3 = { path = "../../vendor/pyo3-0.25.1", version = "=0.25.1", features = ["extension-module", "checked-unicode"] }
itoa = "1"
smallvec = "1.15"
zmij = "=1.0.21"
half = "2.6"
chrono = { version = "0.4", default-features = false, features = ["std"] }
lexical-parse-float = { version = "1.0.5", default-features = false }
simdutf8 = { workspace = true }

[build-dependencies]
pyo3-build-config = "0.25"
# Maturin must include the matching argument code generator in source archives.
# A workspace patch alone does not declare a path dependency for its collector.
pyo3-macros-backend = { path = "../../vendor/pyo3-macros-backend-0.25.1", version = "=0.25.1" }
