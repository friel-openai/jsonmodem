name: Lint

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Run clippy
        run: cargo clippy --workspace --exclude jsonmodem-fuzz --exclude jsonmodem-py --all-targets -- -D warnings

      - name: Run clippy (cfg=miri)
        env:
          RUSTFLAGS: --cfg miri
        run: cargo clippy --workspace --exclude jsonmodem-fuzz --exclude jsonmodem-py --all-targets -- -D warnings


  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Rustfmt toolchain
        id: rustfmt
        run: echo "toolchain=$(cat .agent/rustfmt-toolchain)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rustfmt.outputs.toolchain }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
