name: Miri

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  miri:
    runs-on: ubuntu-latest
    # The unchanged base took 115 minutes; retain time for the added core tests.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly with Miri
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run full suite and targeted memory-safety tests
        run: bash .agent/check-miri.sh

  string-kernels:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly with Miri
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri

      - name: Check native and portable string kernels under both borrow models
        run: bash .agent/check-string-kernels.sh
